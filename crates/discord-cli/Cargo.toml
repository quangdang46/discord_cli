[package]
name = "discord-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Discord CLI binary: commands for AI agents (user-token)"

[[bin]]
name = "discord"
path = "src/main.rs"

# The `dc` binary was the old name; now the single binary is `discord`.

[dependencies]
tokio.workspace = true
clap.workspace = true
serde_json.workspace = true
anyhow.workspace = true
chrono.workspace = true
discord-core = { path = "../discord-core" }
discord-auth = { path = "../discord-auth" }
discord-db = { path = "../discord-db" }
discord-mcp = { path = "../discord-mcp" }
discord-user-rs.workspace = true
mime_guess = "2"
md-5 = "0.10"
reqwest.workspace = true
