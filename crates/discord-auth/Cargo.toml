[package]
name = "discord-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Token auth: auto-detect (DPAPI+LevelDB), paste, keyring, per-install device_id"

[dependencies]
tokio.workspace = true
serde_json.workspace = true
discord-core = { path = "../discord-core" }
reqwest.workspace = true
anyhow.workspace = true
base64.workspace = true
dirs.workspace = true
regex = "1"
rsa = "0.9"
sha2 = "0.10"
qrcode = "0.14"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
rand.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true
