name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            method: cross
            suffix: linux-x86_64
            ext: tar.gz
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            method: cross
            suffix: linux-aarch64
            ext: tar.gz
          - target: x86_64-apple-darwin
            runner: macos-latest
            method: native
            suffix: macos-x86_64
            ext: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            method: native
            suffix: macos-aarch64
            ext: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            method: native
            suffix: windows-x86_64
            ext: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cross (Linux musl targets)
        if: matrix.method == 'cross'
        run: cargo install cross --locked
      - name: Build (${{ matrix.method }})
        shell: bash
        run: |
          if [ "${{ matrix.method }}" = "cross" ]; then
            cross build --release --target ${{ matrix.target }} -p discord-cli
          else
            cargo build --release --target ${{ matrix.target }} -p discord-cli
          fi
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          BIN="discord"
          EXE="target/${{ matrix.target }}/release/${BIN}"
          [ "${{ matrix.ext }}" = "zip" ] && EXE="${EXE}.exe"
          PKG="${BIN}-${{ matrix.suffix }}"
          mkdir -p "dist/${PKG}"
          cp "$EXE" "dist/${PKG}/"
          if [ "${{ matrix.ext }}" = "tar.gz" ]; then
            tar -C dist -czf "dist/${PKG}.tar.gz" "${PKG}"
          else
            (cd dist && 7z a -tzip "${PKG}.zip" "${PKG}")
          fi
          sha256sum "dist/${PKG}.${ext}" > "dist/${PKG}.${ext}.sha256"
          # Keep only archive + checksum in dist so the unpacked binary
          # (and the release asset upload glob below) doesn't leak stray files.
          rm -rf "dist/${PKG}"
        env:
          ext: ${{ matrix.ext }}
      - uses: actions/upload-artifact@v4
        with:
          name: discord-${{ matrix.suffix }}
          path: dist/*
  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
